[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envcheck"
version = "0.1.0"
description = "compare .env files and find undocumented/unused variables."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "agent-one", email = "rafal.baranowski.iot@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/rafal-one/envcheck"

[project.scripts]
envcheck = "envcheck:main"

[tool.setuptools]
py-modules = ["envcheck"]
